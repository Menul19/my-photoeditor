<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menul Photo Editor Pro | 2026 Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a84ff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1051/1051315.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Pacifico&family=Roboto:wght@400;700&family=Bebas+Neue&family=Dancing+Script&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        :root { --primary: #0a84ff; --bg: #000; --panel: #1c1c1e; --text: #fff; --border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { height: 60px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1000; }
        .logo { font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; font-size: 16px; }

        .main-app { display: grid; grid-template-columns: 70px 1fr 300px; flex: 1; height: calc(100vh - 60px); }

        /* Sidebar Navigation */
        .toolbar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 8px; }
        .tool-btn { width: 55px; height: 55px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #888; border: none; background: transparent; font-size: 9px; transition: 0.3s; }
        .tool-btn i { font-size: 18px; margin-bottom: 4px; }
        .tool-btn.active { background: var(--primary); color: white; }

        /* Canvas Middle */
        .editor-area { position: relative; display: flex; align-items: center; justify-content: center; background: #080808; overflow: hidden; flex: 1; padding: 10px; }
        .canvas-wrap { box-shadow: 0 0 30px rgba(0,0,0,0.9); }

        /* Right Panel */
        .controls-panel { background: var(--panel); border-left: 1px solid var(--border); padding: 15px; overflow-y: auto; }
        .control-group { margin-bottom: 15px; background: #2c2c2e; padding: 12px; border-radius: 10px; }
        .control-group h4 { font-size: 11px; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        
        .grid-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .btn-opt { padding: 8px; background: #3a3a3c; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 10px; }

        .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 22px; text-align: center; }
        .sticker-item { cursor: pointer; }

        .btn { padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-main { background: var(--primary); color: white; width: 100%; }

        /* Crop Screen Overlay */
        #crop-screen { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .crop-container { width: 90%; height: 70%; display: flex; align-items: center; justify-content: center; }
        #crop-image-target { max-width: 100%; max-height: 100%; }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            .main-app { grid-template-columns: 1fr; grid-template-rows: 1fr 100px 150px; }
            .toolbar { order: 2; flex-direction: row; width: 100%; height: 70px; justify-content: space-around; border-right: none; border-top: 1px solid var(--border); }
            .controls-panel { order: 3; width: 100%; height: 150px; border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-camera-retro"></i> MENUL EDIT PRO</div>
    <div style="display: flex; gap: 8px;">
        <button class="btn btn-main" style="width: auto; padding: 6px 15px;" onclick="document.getElementById('imgInput').click()">OPEN</button>
        <button class="btn btn-main" style="width: auto; padding: 6px 15px; background: #34c759;" onclick="downloadImage()">SAVE</button>
    </div>
</header>

<div class="main-app">
    <nav class="toolbar">
        <button class="tool-btn active" onclick="showPanel('tune')"><i class="fas fa-sliders-h"></i>Tune</button>
        <button class="tool-btn" onclick="showPanel('filter')"><i class="fas fa-magic"></i>Filters</button>
        <button class="tool-btn" onclick="showPanel('text')"><i class="fas fa-font"></i>Text</button>
        <button class="tool-btn" onclick="showPanel('sticker')"><i class="fas fa-smile"></i>Emoji</button>
        <button class="tool-btn" onclick="openCropper()"><i class="fas fa-crop-alt"></i>Crop</button>
        <button class="tool-btn" style="color:#ff453a;" onclick="deleteSelected()"><i class="fas fa-trash"></i>Del</button>
    </nav>

    <div class="editor-area">
        <input type="file" id="imgInput" hidden accept="image/*">
        <div class="canvas-wrap">
            <canvas id="mainCanvas"></canvas>
        </div>
        
        <div id="crop-screen">
            <div class="crop-container"><img id="crop-image-target"></div>
            <div style="margin-top:20px; display: flex; gap: 10px;">
                <button class="btn btn-main" style="width:140px;" onclick="applyCrop()">Apply</button>
                <button class="btn" style="width:140px; background:#444; color:#fff;" onclick="closeCropper()">Cancel</button>
            </div>
        </div>
    </div>

    <aside class="controls-panel">
        <div id="panel-tune" class="tool-panel">
            <div class="control-group">
                <h4>Tune</h4>
                <label style="font-size:10px;">Brightness</label>
                <input type="range" id="brightness" min="-1" max="1" step="0.01" value="0" style="width:100%; margin-bottom:10px;">
                <label style="font-size:10px;">Contrast</label>
                <input type="range" id="contrast" min="-1" max="1" step="0.01" value="0" style="width:100%;">
            </div>
        </div>

        <div id="panel-filter" class="tool-panel" style="display:none;">
            <div class="control-group">
                <h4>Filters</h4>
                <div class="grid-list">
                    <button class="btn-opt" onclick="applyEffect('none')">None</button>
                    <button class="btn-opt" onclick="applyEffect('grayscale')">B&W</button>
                    <button class="btn-opt" onclick="applyEffect('vintage')">Vintage</button>
                    <button class="btn-opt" onclick="applyEffect('kodachrome')">Kodak</button>
                </div>
            </div>
        </div>

        <div id="panel-text" class="tool-panel" style="display:none;">
            <div class="control-group">
                <h4>Text</h4>
                <input type="text" id="text-input" placeholder="Type..." style="width:100%; padding:8px; background:#111; color:white; border:1px solid #444; margin-bottom:8px;">
                <select id="font-family" style="width:100%; padding:5px; margin-bottom:8px;">
                    <option value="Roboto">Roboto</option>
                    <option value="Lobster">Lobster</option>
                    <option value="Pacifico">Pacifico</option>
                    <option value="Bebas Neue">Bebas Neue</option>
                </select>
                <div style="display:flex; gap:4px; margin-bottom:8px;">
                    <button class="btn-opt" style="flex:1" onclick="toggleStyle('bold')"><b>B</b></button>
                    <button class="btn-opt" style="flex:1" onclick="toggleStyle('italic')"><i>I</i></button>
                    <input type="color" id="text-color" value="#ffffff" style="flex:1; height:30px;">
                </div>
                <button class="btn btn-main" onclick="addText()">ADD</button>
            </div>
        </div>

        <div id="panel-sticker" class="tool-panel" style="display:none;">
            <div class="control-group">
                <h4>Stickers</h4>
                <div class="sticker-grid">
                    <span class="sticker-item" onclick="addSticker('❤️')">❤️</span>
                    <span class="sticker-item" onclick="addSticker('🔥')">🔥</span>
                    <span class="sticker-item" onclick="addSticker('✨')">✨</span>
                    <span class="sticker-item" onclick="addSticker('👑')">👑</span>
                </div>
            </div>
        </div>
    </aside>
</div>

<script>
    let fCanvas, cropper;

    fCanvas = new fabric.Canvas('mainCanvas', { preserveObjectStacking: true });

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    // Image Upload
    document.getElementById('imgInput').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (f) => {
            fabric.Image.fromURL(f.target.result, (img) => {
                const area = document.querySelector('.editor-area');
                let scale = Math.min((area.clientWidth-20)/img.width, (area.clientHeight-20)/img.height);
                fCanvas.clear();
                fCanvas.setDimensions({ width: img.width * scale, height: img.height * scale });
                img.set({ scaleX: scale, scaleY: scale, originX: 'left', originY: 'top' });
                fCanvas.setBackgroundImage(img, fCanvas.renderAll.bind(fCanvas));
            });
        };
        reader.readAsDataURL(file);
    };

    // Crop System
    function openCropper() {
        if(!fCanvas.backgroundImage) return;
        const target = document.getElementById('crop-image-target');
        target.src = fCanvas.backgroundImage.toDataURL();
        document.getElementById('crop-screen').style.display = 'flex';
        if(cropper) cropper.destroy();
        cropper = new Cropper(target, { viewMode: 1, autoCropArea: 0.8 });
    }

    function applyCrop() {
        const url = cropper.getCroppedCanvas().toDataURL();
        fabric.Image.fromURL(url, (img) => {
            const area = document.querySelector('.editor-area');
            let scale = Math.min((area.clientWidth-20)/img.width, (area.clientHeight-20)/img.height);
            fCanvas.clear();
            fCanvas.setDimensions({ width: img.width * scale, height: img.height * scale });
            img.set({ scaleX: scale, scaleY: scale });
            fCanvas.setBackgroundImage(img, fCanvas.renderAll.bind(fCanvas));
            closeCropper();
        });
    }

    function closeCropper() { document.getElementById('crop-screen').style.display = 'none'; }

    // Features
    function addText() {
        const t = new fabric.IText(document.getElementById('text-input').value || "Text", {
            left: 50, top: 50, fontFamily: document.getElementById('font-family').value,
            fill: document.getElementById('text-color').value, fontSize: 35
        });
        fCanvas.add(t).setActiveObject(t);
    }

    function toggleStyle(s) {
        const obj = fCanvas.getActiveObject();
        if(!obj) return;
        if(s==='bold') obj.set('fontWeight', obj.fontWeight==='bold'?'normal':'bold');
        if(s==='italic') obj.set('fontStyle', obj.fontStyle==='italic'?'normal':'italic');
        fCanvas.renderAll();
    }

    function addSticker(e) {
        const s = new fabric.Text(e, { left: 100, top: 100, fontSize: 50 });
        fCanvas.add(s);
    }

    function applyEffect(type) {
        const img = fCanvas.backgroundImage;
        if(!img) return;
        img.filters = [];
        if(type==='grayscale') img.filters.push(new fabric.Image.filters.Grayscale());
        if(type==='vintage') img.filters.push(new fabric.Image.filters.Vintage());
        img.applyFilters();
        fCanvas.renderAll();
    }

    function showPanel(id) {
        document.querySelectorAll('.tool-panel').forEach(p => p.style.display = 'none');
        document.getElementById('panel-' + id).style.display = 'block';
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function deleteSelected() { fCanvas.remove(fCanvas.getActiveObject()); }
    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'menul_pro.png';
        link.href = fCanvas.toDataURL();
        link.click();
    }
</script>
</body>
</html>
